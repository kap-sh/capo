name: Docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

env:
  BUCKET: capo-docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build site
        run: uvx zensical build --strict

      # The main site lives under the `_root/` prefix of the bucket and each
      # service site under `<service>/`, uploaded by service-docs.yml. The
      # bucket is served through an R2 custom domain on `capo-sdk.dev`, with no
      # worker in between; rules on the zone do the rest:
      #   - URL rewrites: `/x` to `_root/x` and `/services/<service>/x` to
      #     `<service>/x`, with `index.html` appended to a path ending in `/`.
      #   - Redirect: a path with no extension and no trailing `/` gets the `/`.
      #   - Redirect: `<service>.capo-sdk.dev/x` to
      #     `capo-sdk.dev/services/<service>/x`.
      #   - Cache rule: everything is eligible for cache, HTML included.
      - name: Upload site
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          # R2 rejects the checksums newer AWS CLI versions send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: aws s3 sync site "s3://$BUCKET/_root" --delete --no-progress

      # Without this the cache keeps serving the previous build for hours.
      - name: Purge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
