name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BATCH_SIZE: 10

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.set.outputs.batches }}
    steps:
      - uses: actions/checkout@v4

      - name: Build service batches
        id: set
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          services = sorted(
              d for d in os.listdir("services")
              if os.path.isfile(os.path.join("services", d, "scripts", "test"))
          )
          size = int(os.environ["BATCH_SIZE"])
          batches = [
              " ".join(services[i:i + size])
              for i in range(0, len(services), size)
          ]
          print("batches=" + json.dumps(batches))
          EOF

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        batch: ${{ fromJson(needs.discover.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint and test batch
        run: |
          set -euo pipefail
          for service in ${{ matrix.batch }}; do
            echo "::group::$service"
            (cd "services/$service" && ./scripts/lint && ./scripts/test)
            echo "::endgroup::"
          done

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Lint
        run: ./scripts/lint

      - name: Start S3-compatible servers
        run: |
          docker compose -f tests/docker-compose.yml up -d
          timeout 60 bash -c 'until nc -z localhost 9000 && nc -z localhost 9010; do sleep 1; done'

      - name: Run integration tests
        run: uv run pytest -rs

      - name: Stop S3-compatible servers
        if: always()
        run: docker compose -f tests/docker-compose.yml down
