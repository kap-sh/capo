name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # a manual run also runs the paid tests (CAPO_PAID=1)
  workflow_dispatch:

permissions:
  contents: read

env:
  BATCH_SIZE: 10
  CAPO_PAID: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
  # the real-AWS tests fail instead of skipping when credentials are missing
  CAPO_REQUIRE_AWS: "1"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.set.outputs.batches }}
    steps:
      - uses: actions/checkout@v4

      - name: Build service batches
        id: set
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          services = sorted(
              d for d in os.listdir("services")
              if os.path.isfile(os.path.join("services", d, "scripts", "test"))
          )
          size = int(os.environ["BATCH_SIZE"])
          batches = [
              " ".join(services[i:i + size])
              for i in range(0, len(services), size)
          ]
          print("batches=" + json.dumps(batches))
          EOF

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        batch: ${{ fromJson(needs.discover.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint and test batch
        run: |
          set -euo pipefail
          for service in ${{ matrix.batch }}; do
            echo "::group::$service"
            (cd "services/$service" && ./scripts/lint && ./scripts/test)
            echo "::endgroup::"
          done

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS role
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Lint
        run: ./scripts/lint

      - name: Start S3-compatible servers
        run: |
          docker compose -f tests/docker-compose.yml up -d
          timeout 60 bash -c 'until nc -z localhost 9010; do sleep 1; done'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::806121398092:role/capo
          aws-region: eu-central-1

      - name: Run integration tests
        run: uv run pytest -rs

      - name: Stop S3-compatible servers
        if: always()
        run: docker compose -f tests/docker-compose.yml down

  pyodide:
    # The async integration tests inside Pyodide (Python on WebAssembly, run by
    # Node); see scripts/test-pyodide.sh. The host Python must match Pyodide's.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS role
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Cache the Pyodide cross-build environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyodide-build
          # uv.lock is not committed, so key on the file that pins pyodide-build
          key: pyodide-xbuildenv-${{ hashFiles('pyproject.toml') }}

      - name: Start S3-compatible servers
        run: |
          docker compose -f tests/docker-compose.yml up -d
          timeout 60 bash -c 'until nc -z localhost 9010; do sleep 1; done'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::806121398092:role/capo
          aws-region: eu-central-1

      - name: Run async integration tests in Pyodide
        run: ./scripts/test-pyodide.sh -rs

      - name: Stop S3-compatible servers
        if: always()
        run: docker compose -f tests/docker-compose.yml down
