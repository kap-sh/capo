name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: npm ci

      - name: Create Version Packages PR
        uses: changesets/action@v1
        with:
          version: npm run version:packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # When changesets are pending, changesets/action leaves the checkout on
      # the changeset-release/main branch with a freshly versioned changelog;
      # return to the pushed commit so the steps below see the real HEAD.
      - name: Reset checkout to pushed commit
        run: git checkout --force --quiet "$GITHUB_SHA"

      # Non-empty only on the push that merges the version PR: that push is what
      # prepends a fresh dated section to the root changelog, so the first
      # section is exactly this release. Gating on the section count (not on
      # the file changing) keeps manual changelog edits from cutting a release.
      - name: Detect released services
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # github.event.before is the all-zero SHA for a new branch or force push.
          base=$(git rev-parse --verify --quiet "$BEFORE^{commit}" || echo "HEAD^")
          sections() { git show "$1:CHANGELOG.md" 2>/dev/null | grep -c '^## ' || true; }
          if [ "$(sections HEAD)" -le "$(sections "$base")" ]; then
            echo "services=" >> "$GITHUB_OUTPUT"
            echo "No new release section in root changelog; nothing to publish."
            exit 0
          fi
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import re
          import sys
          from pathlib import Path
          sections = Path("CHANGELOG.md").read_text().split("\n## ")
          top = sections[1] if len(sections) > 1 else ""
          services = sorted(set(re.findall(r"\]\(services/([^/]+)/CHANGELOG\.md\)", top)))
          print(f"Released services ({len(services)}): {' '.join(services)}", file=sys.stderr)
          print("services=" + " ".join(services))
          EOF

      - name: Create GitHub release
        if: steps.changed.outputs.services != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          date=$(python3 scripts/release_notes.py "$RUNNER_TEMP/notes.md")
          tag="release-$date"
          # Same-day re-releases get a numeric suffix (tags fetched via fetch-depth 0).
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1))
            tag="release-$date.$n"
          done
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Release $date" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Dispatch publish workflow
        if: steps.changed.outputs.services != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICES: ${{ steps.changed.outputs.services }}
        run: gh workflow run publish.yml -f services="$SERVICES"

      - name: Dispatch service docs workflow
        if: steps.changed.outputs.services != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICES: ${{ steps.changed.outputs.services }}
        run: gh workflow run service-docs.yml -f services="$SERVICES"
