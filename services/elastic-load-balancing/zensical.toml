[project]
site_name = "capo-elastic-load-balancing"
site_description = "Python SDK for AWS Elastic Load Balancing."
repo_url = "https://github.com/kap-sh/capo/tree/main/services/elastic-load-balancing"
repo_name = "kap-sh/capo"
copyright = "Copyright &copy; 2026 capo contributors"
# Copied from the template; the same stylesheet styles the codegen's own docs.
extra_css = ["stylesheets/extra.css"]

