      "sync-client/operations/create_queue.md",
      "sync-client/operations/delete_message.md",
      "sync-client/operations/delete_message_batch.md",
      "sync-client/operations/delete_queue.md",
      "sync-client/operations/get_queue_attributes.md",
      "sync-client/operations/get_queue_url.md",
      "sync-client/operations/list_dead_letter_source_queues.md",
      "sync-client/operations/list_message_move_tasks.md",
      "sync-client/operations/list_queue_tags.md",
      "sync-client/operations/list_queues.md",
      "sync-client/operations/purge_queue.md",
      "sync-client/operations/receive_message.md",
      "sync-client/operations/remove_permission.md",
      "sync-client/operations/send_message.md",
