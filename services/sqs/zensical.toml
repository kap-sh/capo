[project]
site_name = "capo-sqs"
site_description = "Python SDK for AWS SQS."
repo_url = "https://github.com/kap-sh/capo/tree/main/services/sqs"
repo_name = "kap-sh/capo"
copyright = "Copyright &copy; 2026 capo contributors"
# Copied from the template; the same stylesheet styles the codegen's own docs.
extra_css = ["stylesheets/extra.css"]

