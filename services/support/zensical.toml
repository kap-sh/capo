[project]
site_name = "capo-support"
site_description = "Python SDK for AWS Support."
repo_url = "https://github.com/kap-sh/capo/tree/main/services/support"
repo_name = "kap-sh/capo"
copyright = "Copyright &copy; 2026 capo contributors"
# Copied from the template; the same stylesheet styles the codegen's own docs.
extra_css = ["stylesheets/extra.css"]

# Every client method has its own page under
# `<client>/{operations,paginators,waiters}/` and is listed here. The pages
# under `types/` are deliberately not in the nav: they are still built and
# linked to, but a sidebar listing thousands of types on every page would make
# each page over a megabyte.
nav = [
  { "Getting Started" = "index.md" },
  { "SupportClient" = [
    "sync-client/index.md",
    { "Operations" = [
      "sync-client/operations/add_attachments_to_set.md",
      "sync-client/operations/add_communication_to_case.md",
      "sync-client/operations/complete_attachment_upload.md",
      "sync-client/operations/create_case.md",
      "sync-client/operations/describe_attachment.md",
      "sync-client/operations/describe_attachment_upload_status.md",
      "sync-client/operations/describe_cases.md",
      "sync-client/operations/describe_communications.md",
      "sync-client/operations/describe_create_case_options.md",
      "sync-client/operations/describe_services.md",
      "sync-client/operations/describe_severity_levels.md",
      "sync-client/operations/describe_supported_languages.md",
      "sync-client/operations/describe_trusted_advisor_check_refresh_statuses.md",
      "sync-client/operations/describe_trusted_advisor_check_result.md",
      "sync-client/operations/describe_trusted_advisor_check_summaries.md",
      "sync-client/operations/describe_trusted_advisor_checks.md",
      "sync-client/operations/get_attachment_download_link.md",
      "sync-client/operations/get_attachment_upload_links.md",
      "sync-client/operations/refresh_trusted_advisor_check.md",
      "sync-client/operations/resolve_case.md",
    ] },
    { "Paginators" = [
      "sync-client/paginators/iter_describe_cases.md",
      "sync-client/paginators/iter_describe_communications.md",
    ] },
  ] },
  { "AsyncSupportClient" = [
    "async-client/index.md",
    { "Operations" = [
      "async-client/operations/add_attachments_to_set.md",
      "async-client/operations/add_communication_to_case.md",
      "async-client/operations/complete_attachment_upload.md",
      "async-client/operations/create_case.md",
      "async-client/operations/describe_attachment.md",
      "async-client/operations/describe_attachment_upload_status.md",
      "async-client/operations/describe_cases.md",
      "async-client/operations/describe_communications.md",
      "async-client/operations/describe_create_case_options.md",
      "async-client/operations/describe_services.md",
      "async-client/operations/describe_severity_levels.md",
      "async-client/operations/describe_supported_languages.md",
      "async-client/operations/describe_trusted_advisor_check_refresh_statuses.md",
      "async-client/operations/describe_trusted_advisor_check_result.md",
      "async-client/operations/describe_trusted_advisor_check_summaries.md",
      "async-client/operations/describe_trusted_advisor_checks.md",
      "async-client/operations/get_attachment_download_link.md",
      "async-client/operations/get_attachment_upload_links.md",
      "async-client/operations/refresh_trusted_advisor_check.md",
      "async-client/operations/resolve_case.md",
    ] },
    { "Paginators" = [
      "async-client/paginators/iter_describe_cases.md",
      "async-client/paginators/iter_describe_communications.md",
    ] },
  ] },
  { "Types" = "types/index.md" },
  { "Errors" = [
    "errors/index.md",
    "errors/AttachmentIdNotFound.md",
    "errors/AttachmentLimitExceeded.md",
    "errors/AttachmentSetExpired.md",
    "errors/AttachmentSetIdNotFound.md",
    "errors/AttachmentSetSizeLimitExceeded.md",
    "errors/CaseCreationLimitExceeded.md",
    "errors/CaseIdNotFound.md",
    "errors/DescribeAttachmentLimitExceeded.md",
    "errors/DeserializationError.md",
    "errors/DryRunOperationException.md",
    "errors/InternalServerError.md",
    "errors/SerializationError.md",
    "errors/ServiceError.md",
    "errors/SupportError.md",
    "errors/ThrottlingException.md",
    "errors/UnknownServiceError.md",
    "errors/UploadIdNotFound.md",
    "errors/WaiterFailedError.md",
    "errors/WaiterTimeoutError.md",
  ] },
]
# `src` is deliberately not watched: it holds thousands of generated files and
# watching it adds well over a minute to every build.
watch = ["README.md"]

[project.theme]
language = "en"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.prune",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.font]
text = "Geist"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[project.extra]
# No "Made with Zensical" notice in the footer.
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/kap-sh/capo"

# The API reference is rendered from the docstrings in src/ by mkdocstrings.
# `_services` and `types` have no `__init__.py`, and griffe does not descend
# into namespace packages nested in a regular package. `docs_src/capo_support` is a
# namespace package that symlinks to them, so griffe loads both under their
# real `capo_support.*` paths.
# `docs_src/templates` overrides the backlinks template: no "Returned by"
# section, and "Used by" is collapsed.
[project.plugins.mkdocstrings]
custom_templates = "docs_src/templates"

[project.plugins.mkdocstrings.handlers.python]
paths = ["docs_src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
# The recommended mkdocstrings-python settings, see
# https://mkdocstrings.github.io/python/usage/#recommended-settings
docstring_section_style = "list"
relative_crossrefs = true
scoped_crossrefs = true
signature_crossrefs = true
unwrap_annotated = true
filters = "public"
inherited_members = true
heading_level = 1
type_parameter_headings = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
line_length = 88
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
show_signature_type_parameters = true
backlinks = "tree"
show_bases = false
# Deviation from the recommended settings: parameter headings would list every
# parameter of every method in the table of contents.
parameter_headings = false
# The summary would list a TypedDict's attributes a second time, above their
# own entries, and the inheritance diagram is a single box for every class here.
summary = false
show_inheritance_diagram = false
# On top of the recommended settings: the client modules are tens of thousands
# of lines long, and paginators (`iter_*`) and waiters (`wait_until_*`) carry
# no docstring.
show_source = false
show_if_no_docstring = true

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
ignore_init_summary = true

# Defining `markdown_extensions` replaces Zensical's defaults entirely, so the
# default set is repeated here, with `pymdownx.snippets` added on top.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
